name: build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GHCUP_INSTALL_BASE_PREFIX: /home/runner

jobs:
  build:
    name: GHC ${{ matrix.ghc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc-version: ['9.12.4']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Restore file timestamps
        run: |
          rev=HEAD
          for f in $(git ls-tree -r -t --full-name --name-only "$rev"); do
            touch -d "$(git log --pretty=format:%cI -1 "$rev" -- "$f")" "$f"
          done

      - name: Cache GHC
        id: cache-ghc
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /home/runner/.ghcup
          key: ${{ runner.os }}-ghcup-v2-${{ matrix.ghc-version }}

      - name: Install GHC and cabal
        if: steps.cache-ghc.outputs.cache-hit != 'true'
        env:
          BOOTSTRAP_HASKELL_NONINTERACTIVE: 1
          BOOTSTRAP_HASKELL_MINIMAL: 1
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh
          /home/runner/.ghcup/bin/ghcup install ghc ${{ matrix.ghc-version }} --set
          /home/runner/.ghcup/bin/ghcup install cabal latest --set

      - name: Set up PATH
        run: echo "/home/runner/.ghcup/bin" >> "$GITHUB_PATH"

      - name: Update package index
        run: /home/runner/.ghcup/bin/cabal update

      - name: Configure the build
        run: cabal configure --enable-tests --disable-documentation

      - name: Cache cabal store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /home/runner/.cabal/store
          key: ${{ runner.os }}-ghc-${{ matrix.ghc-version }}-store-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc-version }}-store-

      - name: Cache dist-newstyle
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc-version }}-dist-${{ hashFiles('cabal.project.freeze') }}-${{ hashFiles('**/*.hs', '**/*.cabal', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc-version }}-dist-${{ hashFiles('cabal.project.freeze') }}-

      - name: Install dependencies
        run: cabal build all --only-dependencies

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all --test-option=--jobs=4 --test-option=--fail-fast
