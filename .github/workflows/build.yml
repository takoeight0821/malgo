name: build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: GHC 9.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Restore file timestamps
        run: |
          rev=HEAD
          for f in $(git ls-tree -r -t --full-name --name-only "$rev"); do
            touch -d "$(git log --pretty=format:%cI -1 "$rev" -- "$f")" "$f"
          done

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Cache GHC
        id: cache-ghc
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.ghcup
          key: ${{ runner.os }}-ghcup-v3-${{ hashFiles('mise.toml') }}

      - name: Setup GHC and cabal
        run: mise run setup

      - name: Configure the build
        run: cabal configure --enable-tests --disable-documentation

      - name: Cache cabal store
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-cabal-store-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-cabal-store-

      - name: Cache dist-newstyle
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-dist-${{ hashFiles('cabal.project.freeze') }}-${{ hashFiles('**/*.hs', '**/*.cabal', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dist-${{ hashFiles('cabal.project.freeze') }}-

      - name: Install dependencies
        run: cabal build all --only-dependencies

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all --test-option=--jobs=4 --test-option=--fail-fast
