name: build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: GHC ${{ matrix.ghc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc-version: ['9.12', '9.10']

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Remove cabal.project.freeze
        run: rm -f cabal.project.freeze

      - name: Cache GHCup
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        id: ghcup-cache
        with:
          path: ~/.ghcup
          key: ${{ runner.os }}-ghcup-${{ matrix.ghc-version }}

      - name: Set up GHC ${{ matrix.ghc-version }}
        if: steps.ghcup-cache.outputs.cache-hit != 'true'
        uses: haskell-actions/setup@82e8b5066385702e477d9dc98f287070493e8abd # v2.8.2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc-version }}
          cabal-version: 'latest'
          cabal-update: true

      - name: Restore GHC from cache
        if: steps.ghcup-cache.outputs.cache-hit == 'true'
        run: |
          export PATH="$HOME/.ghcup/bin:$PATH"
          echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"
          echo "ghc-version=$(ghc --numeric-version)" >> "$GITHUB_OUTPUT"
          echo "cabal-version=$(cabal --numeric-version)" >> "$GITHUB_OUTPUT"
          echo "cabal-store=$(cabal path -z --store-dir 2>/dev/null || echo "$HOME/.cabal/store")" >> "$GITHUB_OUTPUT"
          cabal update
        id: setup-cached

      - name: Configure the build
        env:
          GHC_VERSION: ${{ steps.setup.outputs.ghc-version || steps.setup-cached.outputs.ghc-version }}
          CABAL_VERSION: ${{ steps.setup.outputs.cabal-version || steps.setup-cached.outputs.cabal-version }}
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation
          cabal build all --dry-run
        # The last step generates dist-newstyle/cache/plan.json for the cache key.

      - name: Restore cached dependencies
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version || steps.setup-cached.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version || steps.setup-cached.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store || steps.setup-cached.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build all --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store || steps.setup-cached.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all