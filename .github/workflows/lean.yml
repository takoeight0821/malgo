name: lean

# CI for the Malgo compiler, written in Lean 4 under lean/. This is the
# whole of CI: the Haskell implementation it was ported from is gone, and
# build.yml with it.
#
# Jobs beyond lean-build are gated by lean/ci-gates.env, from when they
# tracked the port's milestones; the flags now serve as a kill switch for a
# gate that has become too slow to run per-PR (LEAN_SELFHOST_L2, see #385).
# The whole workflow also runs nightly so a gate nobody's changes happen to
# touch still reports within a day.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly, off-peak; arbitrary minute to avoid the top-of-hour GitHub Actions crowd
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      selfhost: ${{ steps.g.outputs.LEAN_SELFHOST }}
      selfhostL2: ${{ steps.g.outputs.LEAN_SELFHOST_L2 }}
      zig: ${{ steps.g.outputs.LEAN_ZIG }}
      nixBuild: ${{ steps.g.outputs.NIX_BUILD }}
      l2Run: ${{ steps.l2.outputs.run }}
      l2Cases: ${{ steps.l2.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Level 2 path filter below diffs against the base branch.
          fetch-depth: 0
      - id: g
        run: grep -v '^#' lean/ci-gates.env | grep -v '^$' >> "$GITHUB_OUTPUT"

      # Whether l2-build/l2-case run, and over which cases. Off a pull
      # request that is all five, as before. On one it is a single
      # representative case, and only when the PR touches an input Level 2
      # has and Level 1 does not: the Zig backend and its runtime (the
      # evaluator is a Zig-compiled binary), runtime/malgo (what the
      # evaluator interprets), or the harness. Anything else reaching Level 2
      # reaches lean-selfhost first, and that runs on every PR.
      #
      # `cases` stays non-empty even when `run` is 0: GitHub expands a job's
      # matrix before it evaluates the job's `if`, and an empty vector is an
      # error rather than a skip.
      - id: l2
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'run=1' >> "$GITHUB_OUTPUT"
            echo 'cases=["Echo","Factorial","Fib","StringOps","Bool"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'cases=["Fib"]' >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          changed="$(git diff --name-only "origin/${BASE}...HEAD")"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(lean/Malgo/Backend/Zig/|runtime/zig/|runtime/malgo/|scripts/selfhost-level2\.sh$|\.github/workflows/lean\.yml$)'; then
            echo 'run=1' >> "$GITHUB_OUTPUT"
          else
            echo 'run=0' >> "$GITHUB_OUTPUT"
          fi

  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lean
        with:
          test: true

  # What lean-parity used to be: it diffed the two implementations' output
  # over the corpus, which needs two implementations. `cli-gate.sh` keeps the
  # half that was never about parity -- driving the actual CLI binary, which
  # `lake test` does not (it calls library functions in process) -- plus the
  # error-fixture contract, which nothing else asserts.
  cli-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-lean

      - name: CLI gate (eval / bigstep / error)
        run: bash scripts/cli-gate.sh

      # Moved here from build.yml, which was this gate's only caller.
      - name: Lint examples, testcases, and runtime
        run: scripts/lint-sources.sh examples/malgo test/testcases runtime/malgo

  lean-selfhost:
    needs: gates
    if: needs.gates.outputs.selfhost == '1'
    runs-on: ubuntu-latest
    # Level 1 only. Level 2 lives in l2-build + l2-case below, because a single
    # job running all five L2 cases took 26.7 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-lean

      # Same include_str staleness as lean-zig-golden: without this the job
      # compiles Main.mlg against a cached, stale embedded runtime. That is
      # not hypothetical -- it is how this step first failed, with every one
      # of the 73 cases dying on `malgo_read_file` after that primitive had
      # already been implemented. See lean/Malgo/Backend/Zig/Runtime.lean.
      - name: Rebuild the embedded Zig runtime
        run: |
          rm -f lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.olean \
                lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.trace \
                lean/.lake/build/ir/Malgo/Backend/Zig/Runtime.c
          cd lean && lake build malgo

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'

      - name: Self-hosted golden (Level 1 — Malgo-in-Malgo compiler, Zig backend)
        run: bash scripts/selfhost-golden.sh

  # ===== Level 2, split so no single job runs long =====
  #
  # Not run on pull requests at all: a case is minutes, and the jobs here are
  # concurrent, so L2 would set the whole run's wall clock and push PR feedback
  # from ~3 minutes to well past it. Master pushes and the nightly cron still
  # catch a regression within a day, which is the coverage that mattered --
  # since #395 L2 had been running nowhere.
  #
  # Why two jobs. Measured on run 30239212721, one job running all five cases
  # took 26.7 minutes, and the fixed cost was almost entirely `malgo compile
  # Main.mlg` (~105s; the 14-module precompile is only ~12s). Splitting per case
  # without splitting the build would make each job ~11 min -- still over
  # budget -- so the evaluator is built once and handed to the case jobs.
  #
  # This also buys headroom on CASE_TIMEOUT. Five concurrent cases contend on a
  # runner with far fewer cores than a workstation: unthrottled they all blew
  # past 600s, at PARALLEL_JOBS=2 they were 435-492s. One case alone on a runner
  # has no contention at all.
  #
  # CASE_TIMEOUT went 600 -> 1200 once, and the rule it replaces said not to do
  # that -- raising the cap is what buried #385. The reason it is right here is
  # that nothing got slower. A case is ~220s on an M-series laptop, and over
  # September the same five cases on the same commit landed on either side of
  # 600s depending on the day: Bool, Echo and Factorial each passed exactly once
  # while the rest timed out. That is the spread of GitHub's runner fleet
  # straddling the cap, not a case that regressed. The rule still holds for the
  # thing it was written about: if a case gets slower, take the time out of the
  # case (#407). A cap has to sit clear of fleet variance to measure that at all.
  l2-build:
    needs: gates
    if: needs.gates.outputs.selfhostL2 == '1' && needs.gates.outputs.l2Run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-lean

      # Not optional, for the same reason lean-selfhost and lean-zig-golden do
      # it: Lake does not reliably track the include_str that embeds
      # runtime.zig, so without this the evaluator can be built against a stale
      # cached runtime. See lean/Malgo/Backend/Zig/Runtime.lean.
      - name: Rebuild the embedded Zig runtime
        run: |
          rm -f lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.olean \
                lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.trace \
                lean/.lake/build/ir/Malgo/Backend/Zig/Runtime.c
          cd lean && lake build malgo

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'

      - name: Build the Level 1 evaluator
        env:
          BUILD_ONLY: 1
          PRECOMPILE_TIMEOUT: 300
          # This binary is uploaded and run by l2-case on a *different*
          # runner, and GitHub's x86_64 fleet is mixed. Without this, Zig
          # compiles for the building host's CPU, and an evaluator built
          # where AVX-512 exists died with SIGILL where it does not --
          # intermittently, since it depends on which pair of runners the two
          # jobs drew. See Malgo.Backend.Zig.Toolchain.mcpuArgs.
          MALGO_ZIG_MCPU: baseline
        run: bash scripts/selfhost-level2.sh

      # 5.6 MB. The binary is the whole dependency: it reads Main.mlg and its
      # imports as source at run time, and .malgo-work is the Lean compiler's
      # workspace, not the evaluator's -- verified by running a case with an
      # empty workspace and no Lean toolchain present.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l2-evaluator
          path: .malgo-work/malgoc
          retention-days: 1
          if-no-files-found: error

  l2-case:
    needs: [gates, l2-build]
    if: needs.gates.outputs.selfhostL2 == '1' && needs.gates.outputs.l2Run == '1'
    runs-on: ubuntu-latest
    # One case, no contention, plus ~10s of setup. The CASE_TIMEOUT below is
    # the real gate; this is only a backstop against a hang.
    timeout-minutes: 25
    strategy:
      # Each case is an independent claim about the evaluator. Cancelling the
      # others on the first failure would throw away exactly the information
      # needed to tell "one case regressed" from "the evaluator is broken".
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.gates.outputs.l2Cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: l2-evaluator

      - name: Level 2 — ${{ matrix.case }}
        env:
          EVAL_BIN: ./malgoc
          L2_CASES: ${{ matrix.case }}
          PARALLEL_JOBS: 1
          # A case is ~220s on an M-series laptop and these runners are
          # several times slower at it, so 600s sat close enough to the real
          # figure that cases flipped between pass and timeout run to run.
          CASE_TIMEOUT: 1200
        run: |
          chmod +x ./malgoc
          bash scripts/selfhost-level2.sh

  lean-zig-golden:
    needs: gates
    if: needs.gates.outputs.zig == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-lean

      # Lake's tracking of `include_str` is not reliable: measured on one edit,
      # changing runtime.zig rebuilt Runtime.olean but reverting that change did
      # not, and `lake build` reported success while the binary kept embedding
      # the old runtime text. Combined with setup-lean's .lake cache, a PR that
      # touches only runtime.zig would otherwise compile all 73 cases against
      # the PREVIOUS runtime and report green. Runs after setup-lean because
      # that is what restores the cache; rebuilding one module is negligible
      # against this job's Zig toolchain time. Unconditional on purpose — a
      # "did runtime.zig change?" guard reintroduces the bug it fixes.
      # See lean/Malgo/Backend/Zig/Runtime.lean.
      - name: Rebuild the embedded Zig runtime
        run: |
          rm -f lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.olean \
                lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.trace \
                lean/.lake/build/ir/Malgo/Backend/Zig/Runtime.c
          cd lean && lake build malgo

      # Also caches Zig's own global cache directory, keyed on the Zig version.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'

      # These used to run in build.yml, which the Haskell retirement removed.
      - name: Run Zig runtime unit tests
        # The script carries -lc and -fllvm; see its header for why each one
        # fails on exactly one platform. This job has zig from setup-zig and no
        # mise, so it calls the script directly, like the two gates below.
        run: bash scripts/zig-runtime-test.sh

      - name: Zig backend golden parity sweep
        env:
          MAX_FAILURES: 40
          COMPILE_TIMEOUT: 120
          CASE_TIMEOUT: 30
        run: bash scripts/zig-golden.sh

      # The sweep's cases are all shallow; this is the one that would have
      # SIGSEGV'd before the trampoline (issue #360).
      - name: Zig backend deep-recursion gate
        run: bash scripts/zig-deep-recursion.sh

  # Unconditional (no ci-gates.env flag), unlike lean-selfhost/l2/lean-zig-golden:
  # the sweep is 73 short-lived interpreted Scheme scripts, not a native build+
  # link+run cycle, so it has no slow-CI-job reason to be gated off. See #416.
  lean-scheme-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-lean

      # Not `apt-get install chezscheme`: Ubuntu's apt package tracks its own
      # release cadence, not Chez's upstream version, so it silently drifts
      # from whatever version mise.toml pins for local dev -- exactly the
      # version-skew scenario the zig pin's own comment (mise.toml) exists to
      # prevent, for a backend nix-config now builds on. mise installs the
      # identical pinned build both places.
      #
      # mise's chezscheme plugin has no Linux binary release to fetch, so
      # `mise install` here means "build Chez from source" -- which needs two
      # headers/libraries `ubuntu-latest` doesn't ship by default:
      # `X11/Xlib.h` (`c/expeditor.c`'s line editor) and `-lncurses` (the
      # final link step). Confirmed by actually building 10.4.1 in a plain
      # `ubuntu:latest` container until it succeeded clean, not guessed from
      # the first error alone -- the X11 fix alone still failed to link.
      - name: Install Chez Scheme (pinned via mise, matches mise.toml)
        run: |
          sudo apt-get update && sudo apt-get install -y libx11-dev libncurses-dev
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install chezscheme
          echo "$("$HOME/.local/bin/mise" where chezscheme)/bin" >> "$GITHUB_PATH"

      - name: Chez Scheme backend golden parity sweep
        run: bash scripts/scheme-golden.sh

      - name: Subprocess-exec regression check (interpreter vs Scheme backend)
        run: bash scripts/scheme-process-check.sh

      - name: File I/O edge-case regression check (interpreter vs Scheme backend)
        run: bash scripts/scheme-file-io-check.sh

      - name: JSON parser regression check (interpreter vs Scheme backend)
        run: bash scripts/json-check.sh

  # Ungated, like lean-scheme-golden: this is fast enough for per-PR feedback,
  # so it needs no kill switch in lean/ci-gates.env.
  lean-go-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-lean

      # Installed via mise rather than actions/setup-go so the version comes
      # from mise.toml alone -- the same reasoning as the Chez step above,
      # and one fewer place for the pin to drift.
      - name: Install Go (pinned via mise, matches mise.toml)
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install go
          echo "$("$HOME/.local/bin/mise" where go)/bin" >> "$GITHUB_PATH"

      # Lake does not reliably track the `include_str` that embeds
      # runtime/go/runtime.go, so a build can report success while the binary
      # keeps emitting the previous runtime text. Same step, same reason, as
      # the Zig job's.
      - name: Force a re-embed of the Go runtime
        run: |
          rm -f lean/.lake/build/lib/lean/Malgo/Backend/Go/Runtime.olean \
                lean/.lake/build/lib/lean/Malgo/Backend/Go/Runtime.trace \
                lean/.lake/build/ir/Malgo/Backend/Go/Runtime.c
          cd lean && lake build

      - name: Go backend golden parity sweep
        run: bash scripts/go-golden.sh

      - name: Go backend deep-recursion gate
        run: bash scripts/go-deep-recursion.sh

  # Gated off pull requests for the same reason as l2-build/l2-case: a
  # from-source Lean bootstrap (flake.nix pins an off-nixpkgs-cache 4.32.0,
  # see PR #421) takes 45-60 minutes with no cache.nixos.org substitute --
  # far too slow for per-PR feedback. Runs on master pushes and the nightly
  # cron only, so a flake regression still surfaces within a day.
  # Matrixed across both of GitHub's native runner architectures now that
  # the flake supports more than aarch64-darwin: macos-latest is genuine
  # aarch64-darwin hardware, ubuntu-latest is genuine x86_64-linux hardware
  # -- nix-config (the one real consumer) runs its own CI on the latter, so
  # this is that exact target, not an emulated stand-in for it.
  # aarch64-linux (the flake's third supported system) has no matching
  # GitHub-hosted runner and isn't covered here; it was verified once,
  # manually, via a native-architecture Docker container.
  nix-build:
    needs: gates
    if: needs.gates.outputs.nixBuild == '1' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: nix build
        run: nix build .#default -L

      - name: Smoke test against nixpkgs' chez (not the mise-installed one)
        run: |
          ./result/bin/malgo eval examples/malgo/Hello.mlg --target scheme > hello.scm
          out="$(nix shell nixpkgs#chez -c scheme --script hello.scm)"
          echo "$out"
          [ "$out" = "Hello, world!" ]

  actions-timeline:
    needs: [gates, lean-build, cli-gate, lean-selfhost, lean-zig-golden, lean-scheme-golden, lean-go-golden, l2-build, l2-case, nix-build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
