name: lean

# CI for the Lean 4 port under lean/. Milestone-gated jobs (parity,
# zig-golden, selfhost) activate via lean/ci-gates.env as the port
# progresses; lean-build (build + golden tests) is always on. M9
# (consolidation): the whole workflow (every gated job, same as any push)
# also runs on a nightly schedule, independent of push/PR activity, so a
# silent divergence (e.g. a Haskell-side change that doesn't touch
# anything the Lean side would rebuild against) is caught within a day
# rather than waiting for the next code change to either implementation.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly, off-peak; arbitrary minute to avoid the top-of-hour GitHub Actions crowd
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      parity: ${{ steps.g.outputs.LEAN_PARITY }}
      selfhost: ${{ steps.g.outputs.LEAN_SELFHOST }}
      selfhostL2: ${{ steps.g.outputs.LEAN_SELFHOST_L2 }}
      zig: ${{ steps.g.outputs.LEAN_ZIG }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: g
        run: grep -v '^#' lean/ci-gates.env | grep -v '^$' >> "$GITHUB_OUTPUT"

  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          test: true

  lean-parity:
    needs: gates
    if: needs.gates.outputs.parity == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-haskell-cached
        id: setup
        with:
          ghc-version: '9.12.4'

      - name: Cache cabal store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-9.12.4-store-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.12.4-store-

      - name: Cache dist-newstyle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-ghc-9.12.4-dist-malgo-${{ hashFiles('cabal.project.freeze') }}-${{ hashFiles('src/**/*.hs', '*.cabal', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.12.4-dist-malgo-${{ hashFiles('cabal.project.freeze') }}-

      - name: Build the Haskell malgo executable
        run: cabal build exe:malgo

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false

      - name: Cross-implementation parity (eval, bigstep, fingerprint)
        run: bash scripts/lean-parity.sh

      - name: Cross-implementation parity (error mode)
        run: bash scripts/lean-parity.sh --mode error

      # The only thing that drives the actual CLI binary across the corpus:
      # lake test calls library functions in process. Also carries the error
      # -fixture contract, which nothing else asserts once lean-parity.sh
      # goes away with the Haskell implementation.
      - name: CLI gate (eval / bigstep / error, Lean binary)
        run: bash scripts/cli-gate.sh

  lean-selfhost:
    needs: gates
    if: needs.gates.outputs.selfhost == '1'
    runs-on: ubuntu-latest
    # This one job runs both levels, and L2 through the Zig backend is ~7.5x
    # slower per case than the Chez Scheme path it replaced (measured locally:
    # 220s vs 29s on Fib).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false

      # Same include_str staleness as lean-zig-golden: without this the job
      # compiles Main.mlg against a cached, stale embedded runtime. That is
      # not hypothetical -- it is how this step first failed, with every one
      # of the 73 cases dying on `malgo_read_file` after that primitive had
      # already been implemented. See lean/Malgo/Backend/Zig/Runtime.lean.
      - name: Rebuild the embedded Zig runtime
        run: |
          rm -f lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.olean \
                lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.trace \
                lean/.lake/build/ir/Malgo/Backend/Zig/Runtime.c
          cd lean && lake build malgo

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'

      - name: Self-hosted golden (Level 1 — Malgo-in-Malgo compiler, Zig backend)
        run: MALGO=lean/.lake/build/bin/malgo MALGO_WORK_DIR=.malgo-work-lean bash scripts/selfhost-golden.sh

      # Disabled via lean/ci-gates.env until #385 makes L2 affordable: it is
      # ~16 minutes on its own, against a target of keeping CI under 10.
      - name: Self-hosted metacircular (Level 2)
        if: needs.gates.outputs.selfhostL2 == '1'
        run: |
          MALGO=lean/.lake/build/bin/malgo MALGO_WORK_DIR=.malgo-work-lean \
          CASE_TIMEOUT=1200 PRECOMPILE_TIMEOUT=300 bash scripts/selfhost-level2.sh

  lean-zig-golden:
    needs: gates
    if: needs.gates.outputs.zig == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false

      # Lake's tracking of `include_str` is not reliable: measured on one edit,
      # changing runtime.zig rebuilt Runtime.olean but reverting that change did
      # not, and `lake build` reported success while the binary kept embedding
      # the old runtime text. Combined with lean-action's .lake cache, a PR that
      # touches only runtime.zig would otherwise compile all 73 cases against
      # the PREVIOUS runtime and report green. Runs after lean-action because
      # that is what restores the cache; rebuilding one module is negligible
      # against this job's Zig toolchain time. Unconditional on purpose — a
      # "did runtime.zig change?" guard reintroduces the bug it fixes.
      # See lean/Malgo/Backend/Zig/Runtime.lean.
      - name: Rebuild the embedded Zig runtime
        run: |
          rm -f lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.olean \
                lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.trace \
                lean/.lake/build/ir/Malgo/Backend/Zig/Runtime.c
          cd lean && lake build malgo

      # Also caches Zig's own global cache directory, keyed on the Zig version.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'

      # runtime.zig is shared by both implementations but its unit tests only
      # ran in build.yml, which will not survive the Haskell retirement.
      - name: Run Zig runtime unit tests
        run: zig test -lc runtime/zig/runtime.zig

      - name: Zig backend golden parity sweep (Lean malgo compile)
        env:
          MAX_FAILURES: 40
          COMPILE_TIMEOUT: 120
          CASE_TIMEOUT: 30
        run: |
          MALGO=lean/.lake/build/bin/malgo MALGO_WORK_DIR=.malgo-work-lean \
          bash scripts/zig-golden.sh

      # The sweep's cases are all shallow; this is the one that would have
      # SIGSEGV'd before the trampoline (issue #360).
      - name: Zig backend deep-recursion gate (Lean malgo compile)
        run: |
          MALGO=lean/.lake/build/bin/malgo MALGO_WORK_DIR=.malgo-work-lean \
          bash scripts/zig-deep-recursion.sh

  actions-timeline:
    needs: [gates, lean-build, lean-parity, lean-selfhost, lean-zig-golden]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@7bf79990b7c09f5dfb570ac30b814ca597bd538e # v3.1.1
