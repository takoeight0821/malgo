name: lean

# CI for the Malgo compiler, written in Lean 4 under lean/. This is the
# whole of CI: the Haskell implementation it was ported from is gone, and
# build.yml with it.
#
# Jobs beyond lean-build are gated by lean/ci-gates.env, from when they
# tracked the port's milestones; the flags now serve as a kill switch for a
# gate that has become too slow to run per-PR (LEAN_SELFHOST_L2, see #385).
# The whole workflow also runs nightly so a gate nobody's changes happen to
# touch still reports within a day.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly, off-peak; arbitrary minute to avoid the top-of-hour GitHub Actions crowd
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      selfhost: ${{ steps.g.outputs.LEAN_SELFHOST }}
      selfhostL2: ${{ steps.g.outputs.LEAN_SELFHOST_L2 }}
      zig: ${{ steps.g.outputs.LEAN_ZIG }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: g
        run: grep -v '^#' lean/ci-gates.env | grep -v '^$' >> "$GITHUB_OUTPUT"

  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          test: true

  # What lean-parity used to be: it diffed the two implementations' output
  # over the corpus, which needs two implementations. `cli-gate.sh` keeps the
  # half that was never about parity -- driving the actual CLI binary, which
  # `lake test` does not (it calls library functions in process) -- plus the
  # error-fixture contract, which nothing else asserts.
  cli-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false

      - name: CLI gate (eval / bigstep / error)
        run: bash scripts/cli-gate.sh

      # Moved here from build.yml, which was this gate's only caller.
      - name: Lint examples, testcases, and runtime
        run: scripts/lint-sources.sh examples/malgo test/testcases runtime/malgo

  lean-selfhost:
    needs: gates
    if: needs.gates.outputs.selfhost == '1'
    runs-on: ubuntu-latest
    # This one job runs both levels. L2 through the Zig backend is ~5x slower per
    # case than the Chez Scheme path it replaced (measured locally and serially:
    # 154s vs 31s on Fib; it was ~7.5x before #403/#405). Re-measure with
    # `mise run perf-baseline -- --tier=l2-ratio`.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false

      # Same include_str staleness as lean-zig-golden: without this the job
      # compiles Main.mlg against a cached, stale embedded runtime. That is
      # not hypothetical -- it is how this step first failed, with every one
      # of the 73 cases dying on `malgo_read_file` after that primitive had
      # already been implemented. See lean/Malgo/Backend/Zig/Runtime.lean.
      - name: Rebuild the embedded Zig runtime
        run: |
          rm -f lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.olean \
                lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.trace \
                lean/.lake/build/ir/Malgo/Backend/Zig/Runtime.c
          cd lean && lake build malgo

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'

      - name: Self-hosted golden (Level 1 — Malgo-in-Malgo compiler, Zig backend)
        run: bash scripts/selfhost-golden.sh

      # Not run on pull requests: L2 is minutes per case, so it would set the
      # whole run's wall clock (the jobs here are concurrent) and push PR
      # feedback from ~3 minutes to well over the 10 we want. On master pushes
      # and the nightly cron it still catches a regression within a day, which
      # is the coverage that mattered -- since #395 it has been running nowhere.
      #
      # PARALLEL_JOBS is the reason this can use a 600s CASE_TIMEOUT at all.
      # Unthrottled, five concurrent cases contend on a runner with far fewer
      # cores than a workstation and every case blew past 600s, while the same
      # sweep is 154-177s per case locally. Lower this further before ever
      # raising CASE_TIMEOUT again (#385).
      - name: Self-hosted metacircular (Level 2)
        if: needs.gates.outputs.selfhostL2 == '1' && github.event_name != 'pull_request'
        env:
          CASE_TIMEOUT: 600
          PRECOMPILE_TIMEOUT: 300
          PARALLEL_JOBS: 2
        run: bash scripts/selfhost-level2.sh

  lean-zig-golden:
    needs: gates
    if: needs.gates.outputs.zig == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false

      # Lake's tracking of `include_str` is not reliable: measured on one edit,
      # changing runtime.zig rebuilt Runtime.olean but reverting that change did
      # not, and `lake build` reported success while the binary kept embedding
      # the old runtime text. Combined with lean-action's .lake cache, a PR that
      # touches only runtime.zig would otherwise compile all 73 cases against
      # the PREVIOUS runtime and report green. Runs after lean-action because
      # that is what restores the cache; rebuilding one module is negligible
      # against this job's Zig toolchain time. Unconditional on purpose — a
      # "did runtime.zig change?" guard reintroduces the bug it fixes.
      # See lean/Malgo/Backend/Zig/Runtime.lean.
      - name: Rebuild the embedded Zig runtime
        run: |
          rm -f lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.olean \
                lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.trace \
                lean/.lake/build/ir/Malgo/Backend/Zig/Runtime.c
          cd lean && lake build malgo

      # Also caches Zig's own global cache directory, keyed on the Zig version.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'

      # These used to run in build.yml, which the Haskell retirement removed.
      - name: Run Zig runtime unit tests
        run: zig test -lc runtime/zig/runtime.zig

      - name: Zig backend golden parity sweep
        env:
          MAX_FAILURES: 40
          COMPILE_TIMEOUT: 120
          CASE_TIMEOUT: 30
        run: bash scripts/zig-golden.sh

      # The sweep's cases are all shallow; this is the one that would have
      # SIGSEGV'd before the trampoline (issue #360).
      - name: Zig backend deep-recursion gate
        run: bash scripts/zig-deep-recursion.sh

  actions-timeline:
    needs: [gates, lean-build, cli-gate, lean-selfhost, lean-zig-golden]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@7bf79990b7c09f5dfb570ac30b814ca597bd538e # v3.1.1
