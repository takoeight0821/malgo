name: malgo-lsp
version: 2.0.0
category: Compilers/Interpreters
github: takoeight0821/malgo
license: BSD3
author: "Yuya Kono"
maintainer: "takohati0821@gmail.com"
copyright: "2017-2025 Yuya Kono"

build-type: Simple

dependencies:
  - base
  - bytestring
  - containers
  - effectful
  - effectful-core
  - effectful-plugin
  - malgo
  - megaparsec
  - text

build-tools:
  - ormolu

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wno-name-shadowing
  - -Wmissing-deriving-strategies
  - -Wmissing-export-lists
  - -optP-Wno-nonportable-include-path
  - -fplugin=Effectful.Plugin

language: GHC2021

default-extensions:
  - BlockArguments
  - DataKinds
  - DefaultSignatures
  - DerivingStrategies
  - FunctionalDependencies
  - LambdaCase
  - MultiWayIf
  - NoImplicitPrelude
  - OverloadedStrings
  - RecordWildCards
  - StrictData
  - TypeFamilies
  - ViewPatterns
  - OverloadedRecordDot
  - NoFieldSelectors
  - TypeData
  - Strict

library:
  source-dirs: src
  exposed-modules:
    - Malgo.LSP
    - Malgo.LSP.Handlers
    - Malgo.LSP.Diagnostics
    - Malgo.LSP.Json
    - Malgo.LSP.Protocol
    - Malgo.LSP.Server
    - Malgo.LSP.Server.JsonRpc

executables:
  malgo-lsp:
    main: Main.hs
    source-dirs: app/
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - malgo-lsp
