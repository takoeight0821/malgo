[tools]
watchexec = "latest"
gh = "latest"
node = "latest"
npm = "latest"
hyperfine = "latest"
chezscheme = "latest"
# Pinned: Zig minor releases break std (e.g. std.Io churn between 0.15 and
# 0.16). Bump deliberately, re-running the full zig-golden sweep.
zig = "0.16.0"

[env]
_.path = ["~/.local/bin", "~/.elan/bin"]

[tasks.setup]
description = "Install elan (Lean toolchain manager); the toolchain itself is pinned by lean/lean-toolchain"
run = "command -v elan >/dev/null 2>&1 || curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none"

[tasks.bust-runtime]
description = "Force a re-embed of runtime/zig/runtime.zig (Lake does not reliably track include_str)"
run = """
rm -f lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.olean \
      lean/.lake/build/lib/lean/Malgo/Backend/Zig/Runtime.trace \
      lean/.lake/build/ir/Malgo/Backend/Zig/Runtime.c
"""

[tasks.build]
description = "Build the compiler"
dir = "lean"
run = "lake build"

[tasks.test]
description = "Run the test suite (extra args after --, e.g. mise run test -- --match PAT)"
depends = ["build"]
dir = "lean"
run = "lake test --"

[tasks.golden-update]
description = "Regenerate and commit golden test files"
depends = ["build"]
run = """
(cd lean && lake test -- --update)
git add .golden/
git commit -m 'chore: regenerate golden files'
"""

[tasks.selfhost-golden]
description = "Run self-hosted golden tests (Level 1)"
depends = ["build"]
run = "bash scripts/selfhost-golden.sh"

[tasks.selfhost-level2]
description = "Run Level 2 metacircular interpreter tests"
depends = ["build"]
run = "bash scripts/selfhost-level2.sh"

[tasks.cli-gate]
description = "Drive the malgo CLI over the corpus (eval / bigstep / error fixtures)"
depends = ["build"]
run = "bash scripts/cli-gate.sh"

[tasks.lint-sources]
description = "Lint every .mlg under examples/, test/testcases/ and runtime/"
depends = ["build"]
run = "bash scripts/lint-sources.sh examples/malgo test/testcases runtime/malgo"

[tasks.zig-golden]
description = "Run Zig backend golden parity sweep (byte parity + leak gate)"
depends = ["build"]
run = "bash scripts/zig-golden.sh"

[tasks.zig-deep-recursion]
description = "Run Zig backend deep-recursion gate (18.8M dispatches; #360 regression)"
depends = ["build"]
run = "bash scripts/zig-deep-recursion.sh"

[tasks.perf-baseline]
description = "Compare MALGO_RC_STATS counters against bench/perf-baseline.json (#385); -- --tier=all --update to reseed"
depends = ["build"]
run = "bash scripts/perf-baseline.sh"

[tasks.exec]
description = "Run the compiler (extra args after --, e.g. mise run exec -- eval examples/malgo/Hello.mlg)"
depends = ["build"]
run = "lean/.lake/build/bin/malgo"

[tasks.changelog]
description = "Generate changelog"
run = "git-chglog -o CHANGELOG.md"

[tasks.wiki]
description = "Create a new wiki file with date prefix"
run = """
    TITLE='{{option(name="title")}}'
    if [ -z "$TITLE" ]; then
        echo "Error: Please provide a title with --option title=\"your-title\""
        exit 1
    fi
    DATE=$(date +%Y-%m-%d)
    FILENAME="wiki/${DATE}-${TITLE}.md"

    if [ -f "$FILENAME" ]; then
        echo "File $FILENAME already exists!"
        exit 1
    fi

    cat > "$FILENAME" << EOF
# $TITLE

Created: $DATE

EOF

    echo "Created: $FILENAME"
"""
