[tools]
watchexec = "latest"
ghcup = "latest"
gh = "latest"
claude = { version = "latest", bin = "claude", platforms = """
[linux-arm64]
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/linux-arm64/claude"

[linux-x64]
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/linux-x64/claude"

[macos-arm64]
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/darwin-arm64/claude"

[macos-x64]
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/darwin-x64/claude"
""", version_list_url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/stable" }
node = "latest"
npm = "latest"
hyperfine = "latest"
chezscheme = "latest"
# Pinned: Zig minor releases break std (e.g. std.Io churn between 0.15 and
# 0.16). Bump deliberately, re-running the full zig-golden sweep.
zig = "0.16.0"

[env]
_.path = ["~/.ghcup/bin", "~/.local/bin", "~/.cabal/bin", "~/.elan/bin"]

[tasks.setup]
description = "Setup tools"
run = [
    "ghcup install ghc 9.12.4",
    "ghcup set ghc 9.12.4",
    "ghcup install cabal latest",
    "ghcup set cabal latest",
    "cabal update",
    "cabal install hpack --overwrite-policy=always --ignore-project",
    "cabal install ormolu --overwrite-policy=always --ignore-project",
]

[tasks.lean-setup]
description = "Install elan (Lean toolchain manager); the toolchain itself is pinned by lean/lean-toolchain"
run = "command -v elan >/dev/null 2>&1 || curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none"

[tasks.lean-build]
description = "Build the Lean 4 port (lean/)"
dir = "lean"
run = "lake build"

[tasks.lean-test]
description = "Run the Lean 4 port's test suite (extra args after --, e.g. mise run lean-test -- --match PAT)"
depends = ["lean-build"]
dir = "lean"
run = "lake test --"

[tasks.setup-hls]
description = "Setup HLS (requires HLS support for the project's GHC version)"
# No HLS binary distribution for GHC 9.12.4 yet (see haskell/haskell-language-server#4890).
# Compiles HLS 2.13.0.0 from source. This takes a long time (~30-60 min).
# Once HLS 2.14.0.0 ships with bindists, replace with:
#   "ghcup install hls latest"
#   "ghcup set hls latest"
run = [
    "ghcup compile hls -v 2.13.0.0 --ghc 9.12.4",
    "ghcup set hls 2.13.0.0",
]

[tasks.format]
description = "Format the code"
run = "ormolu --mode inplace $(find src app test Setup.hs -name '*.hs' 2>/dev/null)"

[tasks.build]
description = "Build the project"
depends = ["format"]
run = "hpack && cabal build"

[tasks.test]
description = "Run the tests"
depends = ["build"]
run = """
    if [ -z '{{option(name=\"match\")}}' ]; then
        cabal test --test-show-details=direct --test-option=--jobs=4 --test-option=--fail-fast
    else
        cabal test --test-show-details=direct --test-options=--match --test-options={{option(name=\"match\")}}
    fi
"""

[tasks.reset]
description = "Reset golden test files"
run = "trash .golden"

[tasks.golden-update]
description = "Regenerate and commit golden test files"
depends = ["build"]
run = """
trash .golden
cabal test --test-show-details=direct --test-option=--jobs=4
git add .golden/
git commit -m 'chore: regenerate golden files'
"""

[tasks.selfhost-golden]
description = "Run self-hosted golden tests (Level 1)"
depends = ["build"]
run = "bash scripts/selfhost-golden.sh"

[tasks.selfhost-level2]
description = "Run Level 2 metacircular interpreter tests"
depends = ["build"]
run = "bash scripts/selfhost-level2.sh"

[tasks.zig-golden]
description = "Run Zig backend golden parity sweep (byte parity + leak gate)"
depends = ["build"]
run = "bash scripts/zig-golden.sh"

[tasks.exec]
description = "Run the project"
depends = ["build"]
run = "cabal exec malgo-exe"

[tasks.met]
description = "Launch MET (M-exp-Tracer): browse a .mlg file's compilation pipeline in the browser"
depends = ["build"]
run = """
    SOURCE='{{option(name="source")}}'
    if [ -z "$SOURCE" ]; then
        echo 'Error: Please provide a source file with --option source="path/to/file.mlg"'
        exit 1
    fi
    PORT='{{option(name="port")}}'
    if [ -z "$PORT" ]; then
        PORT=8080
    fi
    cabal exec met -- "$SOURCE" --port "$PORT" {{option(name="flags")}}
"""

[tasks.changelog]
description = "Generate changelog"
run = "git-chglog -o CHANGELOG.md"

[tasks.graph]
description = "Generate dependency graph"
run = [
    "zsh -c 'grep '^import' src/Malgo/**/*.hs | grep -v Malgo.Prelude | grep -v Malgo.Id | grep -v Malgo.SExpr | sort | uniq | python graph.py > dependencies.dot'",
    "dot -Tsvg dependencies.dot -o dependencies.svg",
]

[tasks.wiki]
description = "Create a new wiki file with date prefix"
run = """
    TITLE='{{option(name="title")}}'
    if [ -z "$TITLE" ]; then
        echo "Error: Please provide a title with --option title=\"your-title\""
        exit 1
    fi
    DATE=$(date +%Y-%m-%d)
    FILENAME="wiki/${DATE}-${TITLE}.md"

    if [ -f "$FILENAME" ]; then
        echo "File $FILENAME already exists!"
        exit 1
    fi

    cat > "$FILENAME" << EOF
# $TITLE

Created: $DATE

EOF

    echo "Created: $FILENAME"
"""
