name: malgo
version: 2.0.0
category: Compilers/Interpreters
github: takoeight0821/malgo
license: BSD3
author: "Yuya Kono"
maintainer: "takohati0821@gmail.com"
copyright: "2017-2025 Yuya Kono"

build-type: Simple

dependencies:
  - base
  - bytestring
  - containers
  - directory
  - effectful
  - effectful-core
  - effectful-plugin
  - binary
  - exceptions
  - filepath
  - hashable
  - microlens
  - microlens-th
  - megaparsec
  - mtl
  - optparse-applicative
  - parser-combinators
  - prettyprinter
  - s-cargot
  - string-conversions
  - text
  - transformers

build-tools:
  - ormolu

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wpartial-fields
  - -Wredundant-constraints

  - -Wno-name-shadowing
  - -Wmissing-deriving-strategies
  - -Wmissing-export-lists

  - -optP-Wno-nonportable-include-path

  - -fplugin=Effectful.Plugin

language: GHC2021

default-extensions:
  - BlockArguments
  - DataKinds
  - DefaultSignatures
  - DerivingStrategies
  - FunctionalDependencies
  - LambdaCase
  - MultiWayIf
  - NoImplicitPrelude
  - OverloadedStrings
  - RecordWildCards
  - StrictData
  - TypeFamilies
  - ViewPatterns
  - OverloadedRecordDot
  - NoFieldSelectors
  - TypeData
  - Strict

library:
  source-dirs: src

executables:
  malgo:
    main: Main.hs
    source-dirs: app/malgo/
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - malgo

tests:
  malgo-test:
    ghc-options: -O0
    defaults: hspec/hspec@main
    other-modules:
      - Malgo.Backend.SchemeSpec
      - Malgo.ElaborateSpec
      - Malgo.ForthSpec
      - Malgo.FeaturesSpec
      - Malgo.InferSpec
      - Malgo.ParserSpec
      - Malgo.Query.EngineSpec
      - Malgo.RenameSpec
      - Malgo.Sequent.BigStepEvalSpec
      - Malgo.Sequent.Core.Fingerprint
      - Malgo.Sequent.Core.FlatCheck
      - Malgo.Sequent.Core.JoinCheck
      - Malgo.Sequent.EvalSpec
      - Malgo.Sequent.ToCoreSpec
      - Malgo.Sequent.ToFunSpec
      - Malgo.TestUtils
    dependencies:
      - malgo
      - hspec
      - hspec-core
      - hspec-golden >= 0.2.2.0
